# ===============================================================================
# GRAPHITI - STACK COMPONENTS
# ===============================================================================
#
# This file contains services that Graphiti contributes to the main stack.
# Used by: stack-live-context/docker-compose.yml
#
# Services:
#   - graphiti: Knowledge Graph Server (FastAPI)
#
# Required external services (defined in main stack):
#   - neo4j: Graph database
#   - vllm: Embeddings server
#   - jaeger: Distributed tracing (optional)
#
# ===============================================================================

services:
  # =============================================================================
  # GRAPHITI - Knowledge Graph Server
  # =============================================================================
  graphiti:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stack-graphiti
    environment:
      # Neo4j connection (provided by main stack)
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - db_backend=neo4j
      - PORT=8000
      # Embeddings via vLLM with Jina embeddings v3
      - OPENAI_API_KEY=${OPENAI_API_KEY:-EMPTY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://vllm:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-jinaai/jina-embeddings-v3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      # OpenTelemetry - Jaeger (optional)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=graphiti
      # Service config
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${GRAPHITI_PORT:-8766}:8000"
    networks:
      - stack-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 10s
      timeout: 5s
      retries: 15

networks:
  stack-network:
    external: true
    name: ${STACK_NETWORK:-semantic-workflow-network}
